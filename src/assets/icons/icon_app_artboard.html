<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BulkPixel Icon Artboard</title>
        <style>
            html,
            body {
                margin: 0;
                width: 1024px;
                height: 1024px;
                overflow: hidden;
                background: transparent;

            body {
                display: grid;
                place-items: center;

            img {
                display: block;
                width: 856px;
                height: 856px;
                object-fit: contain;
            }
        </style>
    </head>
    <body>
        <img src="./logo.png" alt="BulkPixel icon artwork" />
    </body>
</html>
