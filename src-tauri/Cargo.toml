[package]
name = "bulkpixel"
version = "3.1.5"
description = "BulkPixel desktop app"
authors = ["oli"]
edition = "2021"

[lib]
name = "bulkpixel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif", "avif-native", "tiff", "gif", "ico"] }
jxl-oxide = { version = "0.12", features = ["image", "moxcms"] }
kamadak-exif = "0.6"
notify = "8.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
resvg = "0.47"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
webp = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGColorSpace", "std"] }
objc2-core-image = { version = "0.3", default-features = false, features = ["CIContext", "CIImage", "CoreImageDefines", "objc2-core-foundation", "objc2-core-graphics", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDictionary", "NSObject", "NSString", "NSURL", "NSValue", "std"] }
